[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "apexrag"
version = "1.0.0"
description = "Enterprise-grade zero-cost RAG evaluation harness and production pipeline."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.2",
    "rank_bm25>=0.2.2",
    "ollama>=0.1.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
    "scipy>=1.11.0",
    "requests>=2.31.0",
]

[project.urls]
Repository = "https://github.com/your-username/apexrag"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
