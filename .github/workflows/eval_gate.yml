name: ApexRAG CI Evaluation Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test_and_eval_gate:
    name: Run Test Suite & Ragas CI Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch React Corpus Docs
        run: |
          mkdir -p data/raw_docs
          git clone --depth 1 --branch v17.0.2 https://github.com/reactjs/reactjs.org.git data/raw_docs/react-legacy || true
          git clone --depth 1 https://github.com/reactjs/react.dev.git data/raw_docs/react-dev-current || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio pytest-asyncio httpx

      - name: Run Unit & Integration Tests
        run: |
          pytest tests/ -v

      - name: Execute Automated Ragas Evaluation Gate
        run: |
          python -m src.evaluation.ci_gate --sample-size 5 --min-faithfulness 0.35 --min-recall 0.50 --min-relevance 0.60 --output-report reports/ci_eval_gate_summary.md

      - name: Archive Evaluation Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-eval-gate-report
          path: reports/ci_eval_gate_summary.md
