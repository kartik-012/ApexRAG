name: Weekly Corpus Drift Check

on:
  schedule:
    - cron: '0 3 * * 1'   # Every Monday at 3:00 AM UTC
  workflow_dispatch: {}

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Embedding Drift Detector
        run: |
          python -m src.drift.check_drift

      - name: Open GitHub Issue on Drift Detection Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Corpus Drift Detected — Ground Truth Update Required',
              body: 'Weekly automated drift check flagged significant embedding-space shift. Please review data/ground_truth/qa_pairs.json.'
            })
