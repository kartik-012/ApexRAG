# ApexRAG Production Orchestration Stack
# Services:
#   1. apexrag_api: FastAPI application with SSE token streaming & OpenTelemetry tracing
#   2. apexrag_pgvector: PostgreSQL 16 container with pgvector extension & HNSW indexing
#   3. apexrag_prometheus: Prometheus monitoring instance scraping /metrics every 5s

version: '3.8'

services:
  apexrag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apexrag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - DB_HOST=pgvector
      - DB_PORT=5432
      - DB_NAME=apexrag
      - DB_USER=postgres
      - DB_PASSWORD=postgres_password
      - LEGACY_REPO=/app/data/raw_docs/react-legacy
      - CURRENT_REPO=/app/data/raw_docs/react-dev-current
      - CONCURRENCY_LIMIT=16
    volumes:
      - ./data/feedback:/app/data/feedback
      - ./reports:/app/reports
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - apexrag_network

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: apexrag_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: apexrag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./data/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - apexrag_network

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: apexrag_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - apexrag-api
    networks:
      - apexrag_network

volumes:
  pgvector_data:
  prometheus_data:

networks:
  apexrag_network:
    driver: bridge
